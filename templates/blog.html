{% extends "base.html" %}

{% block content %}
<div class="win-outer">
  <div class="win-titlebar">📓 {{ page.title }}</div>
  <div class="win-panel post-content">
    {% if page.date %}
      <time class="post-date" datetime="{{ page.date | date(format='%+') }}">
        {{ page.date | date(format=config.extra.date_format) }}
      </time>
    {% endif %}
    {{ page.content | safe }}
  </div>
</div>
{% endblock content %}
