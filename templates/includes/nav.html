<script>
// Apply stored theme before first paint to avoid flash
(function () {
  var t = localStorage.getItem('theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
}());
</script>
<header>
  <nav>
    <a href="{{ get_url(path='') }}" class="nav-brand">
      <img src="{{ get_url(path='icons/logo.png') }}" alt="{{ config.title }}" class="nav-logo">
      {{ config.title }}
    </a>
    <ul>
      {% for link in config.extra.nav.links %}
      <li>
        <a href="{{ link.url | replace(from='$BASE_URL', to=get_url(path='')) | safe }}" aria-label="{{ link.name }}">
          {% if link.pixel_icon is defined %}
            <img src="{{ get_url(path='icons/' ~ link.pixel_icon) }}" alt="{{ link.name }}" class="nav-pixel-icon">
          {% elif link.icon is defined %}
            <i class="bi bi-{{ link.icon }}"></i>
          {% endif %}
          {{ link.name }}
        </a>
      </li>
      {% endfor %}
    </ul>
    <button id="theme-toggle" class="nav-theme-toggle" aria-label="Toggle light/dark mode">☾</button>
  </nav>
</header>
<script>
(function () {
  var btn = document.getElementById('theme-toggle');
  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    return t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function sync() {
    btn.textContent = isDark() ? '☀' : '☾';
    btn.setAttribute('aria-label', isDark() ? 'Switch to light mode' : 'Switch to dark mode');
  }
  btn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    sync();
  });
  sync();
}());
</script>
