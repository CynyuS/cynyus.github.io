<script>
(function () {
  var btn = document.getElementById('theme-toggle');
  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    return t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
  }
  function sync() {
    btn.textContent = isDark() ? '☀' : '☾';
    btn.setAttribute('aria-label', isDark() ? 'Switch to light mode' : 'Switch to dark mode');
  }
  btn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
    sync();
  });
  sync();
}());
</script>

<script>
(function () {
  var slides = document.querySelectorAll('.art-slide');
  var countEl = document.getElementById('status-count');
  var filenameEl = document.getElementById('status-filename');
  var artworks = [{"file":"placeholder.jpg","title":"Example Artwork"}];
  var current = 0;
  var total = slides.length;

  if (total === 0) return;

  function show(index) {
    slides[current].classList.remove('active');
    current = ((index % total) + total) % total;
    slides[current].classList.add('active');
    countEl.textContent = (current + 1) + ' of ' + total;
    filenameEl.textContent = artworks[current] ? artworks[current].file : '-';
  }

  document.getElementById('prev-btn').addEventListener('click', function () { show(current - 1); });
  document.getElementById('next-btn').addEventListener('click', function () { show(current + 1); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft')  show(current - 1);
    if (e.key === 'ArrowRight') show(current + 1);
  });
}());
</script>
